name: Patch missing sessions yesterday only

on:
  push:
    branches:
      - agent/missing-sessions-yesterday-only

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          data = Path('src/lib/data.ts')
          text = data.read_text()
          old = '''export function getMissingTeachingSessions(daysBack = 60): MissingTeachingSession[] {
  const data = getData();
  const result: MissingTeachingSession[] = [];
  for (let offset = 1; offset <= daysBack; offset++) {
    const date = new Date();
    date.setDate(date.getDate() - offset);
    const dateStr = dateKey(date);
    for (const schedule of data.schedules) {
      if (!schedule.days.includes(date.getDay())) continue;
      if (data.sessions.some(s => s.scheduleId === schedule.id && s.date === dateStr)) continue;
      const subject = data.subjects.find(s => s.id === schedule.subjectId);
      if (data.holidays.some(h => typeof h === 'string' ? h === dateStr : h.date === dateStr && (!h.level || h.level === subject?.level))) continue;
      if (data.scheduleOverrides?.some(o => o.scheduleId === schedule.id && o.date === dateStr && o.skipped)) continue;
      result.push({ schedule, date: dateStr, className: data.classes.find(c => c.id === schedule.classId)?.name ?? '?', subjectName: subject?.name ?? '?' });
    }
  }
  return result.sort((a, b) => b.date.localeCompare(a.date));
}
'''
          new = '''export function getMissingTeachingSessions(): MissingTeachingSession[] {
  const data = getData();
  const result: MissingTeachingSession[] = [];
  const date = new Date();
  date.setDate(date.getDate() - 1);
  const dateStr = dateKey(date);

  for (const schedule of data.schedules) {
    if (!schedule.days.includes(date.getDay())) continue;
    if (data.sessions.some(s => s.scheduleId === schedule.id && s.date === dateStr)) continue;
    const subject = data.subjects.find(s => s.id === schedule.subjectId);
    if (data.holidays.some(h => typeof h === 'string' ? h === dateStr : h.date === dateStr && (!h.level || h.level === subject?.level))) continue;
    if (data.scheduleOverrides?.some(o => o.scheduleId === schedule.id && o.date === dateStr && o.skipped)) continue;
    result.push({ schedule, date: dateStr, className: data.classes.find(c => c.id === schedule.classId)?.name ?? '?', subjectName: subject?.name ?? '?' });
  }

  return result;
}
'''
          if old not in text:
              raise SystemExit('target getMissingTeachingSessions block not found')
          data.write_text(text.replace(old, new))

          today = Path('src/components/TodayView.tsx')
          t = today.read_text()
          t = t.replace('60 hari terakhir', 'Kemarin')
          today.write_text(t)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/data.ts src/components/TodayView.tsx
          git commit -m "fix: only prompt for yesterday missing sessions"
          git push
